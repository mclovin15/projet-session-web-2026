<!DOCTYPE html>
<html lang="fr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Projet Session- Yoan</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script>
      tailwind.config = {
         theme: {
            extend: {
               colors: {
                  primary: "#11b1f0",
                  ink: "#0f172a",
                  mist: "#eef2ff",
                  accent: "#d97706",
                  pine: "#14532d"
               },
               boxShadow: {
                  soft: "0 18px 45px rgba(15, 23, 42, 0.12)"
               }
            }
         }
      };
   </script>
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
   <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">

</head>


<body class="min-h-screen bg-slate-100 text-ink">
   <div class="absolute inset-x-0 top-0 -z-10 h-72"></div>

   <nav class="sticky top-0 z-50 border-b border-slate-200/70 bg-white/85 backdrop-blur">
      <div class="mx-auto flex max-w-7xl items-center gap-6 px-4 py-4 sm:px-6 lg:px-8">
         <a href="/" class="shrink-0">
            <div class="flex items-center gap-3">
               <div
                  class="flex h-11 w-11 items-center justify-center rounded-2xl bg-ink text-sm font-black uppercase tracking-[0.25em] text-primary shadow-soft">
                  YD
               </div>
               <div>
                  <p class="text-xs font-semibold uppercase tracking-[0.35em] text-primary">
                     INF5190
                  </p>
                  <p class="text-lg font-bold text-slate-900">Projet Session</p>
               </div>
            </div>
         </a>

         <div class="ml-auto hidden items-center gap-2 md:flex">
            <a href="/"
               class="rounded-full px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 hover:text-slate-900 {% if request.path == url_for('index') %}bg-primary text-white{% endif %}">
               Accueil
            </a>
            <a href="/inspections"
               class="rounded-full px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 hover:text-slate-900 {% if request.path == url_for('inspections') %}bg-primary text-white{% endif %}">
               Consulter Plaintes
            </a>
            <a href="/doc" target="_blank"
               class="rounded-full px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 hover:text-slate-900">
               Doc API
            </a>
         </div>
      </div>
   </nav>

	<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
	      {% block content %}{% endblock %}
	   </main>
   <script src="{{ url_for('static', filename='js/feedback-message.js') }}"></script>
   <script src="{{ url_for('static', filename='js/index.js') }}"></script>

	</body>

</html>
