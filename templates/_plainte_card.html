<article
    id="plainte-{{ plainte.id_inspection }}"
    class="mt-5 rounded-2xl border border-slate-200 bg-white px-4 py-4 shadow-sm transition hover:border-slate-300 hover:shadow-soft">
    <div
        class="flex flex-col gap-3 xl:grid xl:grid-cols-[minmax(0,2.3fr)_minmax(0,1.2fr)_minmax(0,0.9fr)_minmax(0,1.1fr)] xl:items-start">
        <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2">
                <span
                    class="inline-flex rounded-full shadow-soft bg-primary px-2.5 py-1 text-[11px] font-semibold text-white"
                    title="Id de la plainte">
                    #{{ plainte.id_inspection }}
                </span>
                <span
                    class="inline-flex rounded-full shadow-soft bg-ink px-2.5 py-1 text-[11px] font-semibold text-white"
                    title="Nom complet du client ayant déposé la plainte">
                    <i class="fa-solid fa-user m-auto mr-1"></i>
                    {{ plainte.nom_complet_client }}
                </span>
                <span
                    class="inline-flex rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1 text-[11px] font-semibold text-slate-600"
                    title="Date de la visite du client au restaurant">
                    <i class="fa-solid fa-calendar m-auto mr-1"></i>
                    {{ plainte.date_visite }}
                </span>
                <span
                    class="inline-flex rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1 text-[11px] font-semibold text-slate-600"
                    title="Ville de l'établissement">
                    <i class="fa-solid fa-city m-auto mr-1"></i>
                    {{ plainte.ville }}
                </span>
            </div>

            <h2 class="mt-3 truncate text-lg font-black tracking-tight text-slate-900"
                title="Nom de l'établissement : {{ plainte.etablissement }}">
                {{ plainte.etablissement }}
            </h2>


            <p class="mt-2 truncate text-sm text-slate-600" title="Adresse de l'établissement">
                <i class="fa-solid fa-location-dot mr-1 text-slate-400">
                </i>
                {{ plainte.adresse }}
            </p>
        </div>

        <div class="w-full flex justify-end xl:col-start-4 xl:justify-self-end">
            <div class="flex items-center gap-2">

                <a href="{{ url_for('etablissement_details_page', business_id=plainte.business_id) }}"
                    class="inline-flex items-center justify-center rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50"
                    title="Consulter l'établissement {{ plainte.etablissement }}">
                    <i class="fa-solid fa-eye"></i>
                </a>
                    <button type="button" data-id="{{ plainte.id_inspection }}" 
                        id="demande-inspection-delete"
                        class="inline-flex items-center justify-center rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm font-semibold text-red-700 transition hover:border-red-300 hover:bg-red-100"
                         title="Supprimer la plainte #{{ plainte.id_inspection }}">
                        <i class="fa-solid fa-trash mr-2"></i>
                        Supprimer
                    </button>
                    
            </div>
        </div>
    </div>

    <div
        class="mt-2 flex h-full w-full flex-col justify-between rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-3">
        <div>
            <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400">
                Description de la plainte
            </p>
            <p class="mt-2 mx-2 text-sm leading-5 text-slate-600">
                {{ plainte.description_prob }}
            </p>
        </div>
    </div>
</article>
